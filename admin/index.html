<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin – Fahrtraining Stützpunktfeuerwehr Meilen</title>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --red:#CC0000;--red-dark:#990000;--red-light:#FDEAEA;
  --black:#1a1a1a;--gray:#666;--gray-mid:#e0e0e0;
  --green:#2d6a1f;--green-light:#eaf3e6;
  --bg:#fff;--bg2:#f4f4f4;--bg3:#e8e8e8;
  --text:#1a1a1a;--text2:#555;--text3:#888;
}
body{font-family:'Open Sans',Arial,sans-serif;background:var(--bg3);color:var(--text);min-height:100vh;font-size:14px;}
.site-header{background:var(--black);}
.site-header-inner{max-width:800px;margin:0 auto;padding:0 1rem;display:flex;align-items:center;height:54px;gap:12px;}
.logo-text{color:white;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;line-height:1.2;}
.logo-text span{display:block;font-size:10px;font-weight:400;color:#999;text-transform:none;letter-spacing:0;}
.red-stripe{height:4px;background:var(--red);}
.page{max-width:900px;margin:0 auto;padding:1.5rem 1rem 4rem;}
label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:var(--gray);margin:0.75rem 0 4px;}
label:first-child{margin-top:0;}
input[type="text"],input[type="password"],textarea,select{width:100%;padding:9px 10px;border:1px solid var(--gray-mid);background:var(--bg);color:var(--text);font-size:14px;font-family:inherit;border-radius:0;}
textarea{resize:vertical;min-height:44px;}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--black);}
.btn{height:38px;padding:0 16px;border:2px solid var(--black);background:var(--bg);color:var(--black);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-family:inherit;border-radius:0;}
.btn:hover{background:var(--black);color:#fff;}
.btn:disabled{opacity:0.5;cursor:not-allowed;}
.btn-green{background:var(--green);color:#fff;border-color:var(--green);}
.btn-green:hover{background:#1e4d15;border-color:#1e4d15;}
.btn-red{background:var(--red);color:#fff;border-color:var(--red);}
.btn-red:hover{background:var(--red-dark);border-color:var(--red-dark);}
.card{background:var(--bg);border:1px solid var(--gray-mid);border-top:3px solid var(--red);padding:1.25rem;margin-bottom:1rem;}
.card h2{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:1rem;color:var(--black);}
.login-wrap{max-width:340px;margin:4rem auto;}
.err-msg{color:var(--red);font-size:12px;margin-top:0.5rem;display:none;}
.tabs{display:flex;gap:8px;margin-bottom:1.25rem;}
.tab-btn{flex:1;height:44px;border:2px solid var(--black);background:var(--bg);color:var(--black);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;cursor:pointer;font-family:inherit;}
.tab-btn.active{background:var(--black);color:#fff;}
.entry-card{border:1px solid var(--gray-mid);padding:1rem;margin-bottom:0.75rem;background:var(--bg);position:relative;}
.entry-card.new{border-color:var(--green);border-width:2px;}
.entry-row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.entry-actions{display:flex;gap:8px;margin-top:0.85rem;justify-content:flex-end;}
.entry-num{font-size:10px;color:var(--text3);font-weight:700;position:absolute;top:8px;right:10px;}
.status-msg{font-size:12px;font-weight:600;margin-top:6px;display:none;}
.status-ok{color:var(--green);}
.entry-header{display:flex;align-items:center;gap:10px;cursor:pointer;padding:2px 0;}
.entry-arrow{width:18px;height:18px;flex-shrink:0;transition:transform 0.15s;display:flex;align-items:center;justify-content:center;color:var(--gray);}
.entry-card.open .entry-arrow{transform:rotate(90deg);}
.entry-summary{font-size:13px;font-weight:600;color:var(--text);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.entry-typ-tag{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;padding:2px 6px;background:var(--bg2);color:var(--gray);border:1px solid var(--gray-mid);flex-shrink:0;}
.entry-body{display:none;margin-top:0.75rem;}
.entry-card.open .entry-body{display:block;}
textarea.ans{min-height:64px;}
.status-err{color:var(--red);}
.loading{text-align:center;padding:2rem;color:var(--text3);font-size:13px;}
.empty{text-align:center;padding:2rem;color:var(--text3);font-size:13px;}
.top-actions{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;gap:8px;flex-wrap:wrap;}
.site-footer{background:var(--black);color:#888;font-size:11px;text-align:center;padding:1rem;}
select#admin-fahrzeug{max-width:260px;}
</style>
</head>
<body>

<div class="site-header">
  <div class="site-header-inner">
    <img src="https://www.feuerwehr-meilen.ch/fileadmin/Public/Website/Templates/Images/Logo-FeuerwehrMeilen.png" alt="Stützpunktfeuerwehr Meilen" style="height:38px;width:auto;object-fit:contain;">
    <div class="logo-text">Stützpunktfeuerwehr Meilen<span>Fahrtraining – Admin</span></div>
  </div>
</div>
<div class="red-stripe"></div>

<div class="page">

  <!-- LOGIN -->
  <div id="s-login" class="login-wrap">
    <div class="card">
      <h2>Admin-Login</h2>
      <label>Passwort</label>
      <input type="password" id="admin-pw" onkeydown="if(event.key==='Enter')login()">
      <div class="btn-row" style="margin-top:1rem">
        <button class="btn btn-green" style="width:100%;justify-content:center;height:44px;" onclick="login()">Anmelden</button>
      </div>
      <p class="err-msg" id="login-err">Falsches Passwort.</p>
    </div>
  </div>

  <!-- ADMIN -->
  <div id="s-admin" style="display:none">
    <div class="tabs">
      <button class="tab-btn active" id="tab-dashboard" onclick="switchTab('dashboard')">Dashboard</button>
      <button class="tab-btn" id="tab-fragen" onclick="switchTab('fragen')">Fahrzeugfragen</button>
      <button class="tab-btn" id="tab-meldungen" onclick="switchTab('meldungen')">Einsatzmeldungen</button>
      <button class="tab-btn" id="tab-lookup" onclick="switchTab('lookup')">Fahrer-Lookup</button>
    </div>

    <!-- DASHBOARD -->
    <div id="panel-dashboard">
      <iframe src="../dashboard.html" style="width:100%;height:82vh;border:1px solid var(--gray-mid);display:block;"></iframe>
    </div>

    <!-- FAHRZEUGFRAGEN -->
    <div id="panel-fragen" style="display:none">
      <div class="card">
        <h2>Fahrzeugfragen</h2>
        <div class="entry-row2">
          <div><label>Fahrzeug / Liste</label><select id="admin-fahrzeug" onchange="ladeFragenAdmin()"></select></div>
          <div><label>Typ</label><select id="admin-typ-filter" onchange="renderFragenListe(LETZTE_FRAGEN)">
            <option value="">Alle</option>
            <option value="frage">Frage</option>
            <option value="tätigkeit">Tätigkeit</option>
          </select></div>
        </div>
      </div>
      <div class="top-actions">
        <span id="fragen-count" style="font-size:12px;color:var(--text3)"></span>
        <button class="btn btn-green" onclick="neueFrage()">+ Neue Frage</button>
      </div>
      <div id="fragen-liste"></div>
    </div>

    <!-- EINSATZMELDUNGEN -->
    <div id="panel-meldungen" style="display:none">
      <div class="card">
        <h2>Einsatzmeldungen</h2>
        <label>Sortieren nach</label>
        <select id="admin-meldung-sort" onchange="renderMeldungenListe(LETZTE_MELDUNGEN)">
          <option value="kategorie">Kategorie</option>
          <option value="alarmierung">Alarmierung</option>
        </select>
      </div>
      <div class="top-actions">
        <span id="meldungen-count" style="font-size:12px;color:var(--text3)"></span>
        <button class="btn btn-green" onclick="neueMeldung()">+ Neue Einsatzmeldung</button>
      </div>
      <div id="meldungen-liste"></div>
    </div>

    <!-- FAHRER-LOOKUP -->
    <div id="panel-lookup" style="display:none">
      <div class="card">
        <h2>Fahrer-Lookup</h2>
        <label>Kürzel oder Name</label>
        <div style="display:flex;gap:8px;">
          <input type="text" id="lookup-suche" style="flex:1;" onkeydown="if(event.key==='Enter')sucheLookup()">
          <button class="btn btn-green" onclick="sucheLookup()">Suchen</button>
        </div>
      </div>
      <div id="lookup-ergebnisse"></div>
    </div>
  </div>

</div>

<div class="site-footer">© Stützpunktfeuerwehr Meilen / LOL &nbsp;·&nbsp; CLv1.06</div>

<script>
const SHEETS_URL="https://script.google.com/macros/s/AKfycbwvTL3yecdyTvSV5ZPgGslm5K-3UFjW9zc4A2qn_zUk50CcSIpXEaBE1hMiaU3GnNEQ/exec";
const FAHRZEUGE_B=["PTF 1/6","VA","PTF 4/7","PTF 2/3","OW"];
const FAHRZEUGE_C=["TLF","ADL","PIF","ULF","OC","SVF","MTF"];
const FAHRZEUGE=[...FAHRZEUGE_B,...FAHRZEUGE_C,"Allgemeine Fragen"];

let ADMIN_PW="";
let LETZTE_FRAGEN=[];
let LETZTE_MELDUNGEN=[];
let MITGLIEDER={};

function toggleEntry(id){
  const el=document.getElementById(id);
  if(el) el.classList.toggle("open");
}

let AUSW_FRAGEN=[], AUSW_TAETIGKEITEN=[];

async function ladeMitglieder(){
  try{
    const res=await fetch(SHEETS_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({type:"lade_dashboard_daten"})});
    const daten=await res.json();
    const result={};
    Object.entries(daten.mitglieder||{}).forEach(([k,v])=>{ result[k]={vollerName:v}; });
    MITGLIEDER=result;
  }catch(e){console.warn("Mitglieder konnten nicht geladen werden:",e);}
}


async function callAdmin(payload){
  const res=await fetch(SHEETS_URL,{
    method:"POST",
    headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify(payload)
  });
  const text=await res.text();
  return JSON.parse(text);
}

async function login(){
  const pw=document.getElementById("admin-pw").value;
  const errEl=document.getElementById("login-err");
  errEl.style.display="none";
  try{
    const res=await callAdmin({type:"admin_auth",password:pw});
    if(res.ok){
      ADMIN_PW=pw;
      document.getElementById("s-login").style.display="none";
      document.getElementById("s-admin").style.display="block";
      populateFahrzeugSelect();
      ladeFragenAdmin();
      ladeMitglieder();
    } else {
      errEl.style.display="block";
    }
  }catch(e){
    errEl.textContent="Verbindungsfehler: "+e.message;
    errEl.style.display="block";
  }
}

function switchTab(tab){
  document.getElementById("tab-dashboard").classList.toggle("active",tab==="dashboard");
  document.getElementById("tab-fragen").classList.toggle("active",tab==="fragen");
  document.getElementById("tab-meldungen").classList.toggle("active",tab==="meldungen");
  document.getElementById("tab-lookup").classList.toggle("active",tab==="lookup");
  document.getElementById("panel-dashboard").style.display=tab==="dashboard"?"block":"none";
  document.getElementById("panel-fragen").style.display=tab==="fragen"?"block":"none";
  document.getElementById("panel-meldungen").style.display=tab==="meldungen"?"block":"none";
  document.getElementById("panel-lookup").style.display=tab==="lookup"?"block":"none";
  if(tab==="meldungen") ladeMeldungenAdmin();
}

function populateFahrzeugSelect(){
  const sel=document.getElementById("admin-fahrzeug");
  sel.innerHTML=FAHRZEUGE.map(f=>`<option value="${f}">${f}</option>`).join("");
}

/* ── Fahrzeugfragen ── */
async function ladeFragenAdmin(){
  const sheet=document.getElementById("admin-fahrzeug").value;
  const el=document.getElementById("fragen-liste");
  el.innerHTML='<div class="loading">Wird geladen…</div>';
  try{
    const res=await callAdmin({type:"admin_list_fragen",password:ADMIN_PW,sheet});
    if(res.error){el.innerHTML='<div class="empty">Zugriff verweigert. Bitte neu anmelden.</div>';return;}
    LETZTE_FRAGEN=res.rows||[];
    renderFragenListe(LETZTE_FRAGEN);
  }catch(e){
    el.innerHTML=`<div class="empty">Fehler beim Laden: ${e.message}</div>`;
  }
}

function renderFragenListe(rows){
  const el=document.getElementById("fragen-liste");
  const filter=document.getElementById("admin-typ-filter").value;
  let gefiltert=rows;
  if(filter){
    gefiltert=rows.filter(r=>{
      const t=(r.typ||"frage").toLowerCase();
      const istTaetigkeit=t==="tätigkeit"||t==="taetigkeit";
      return filter==="tätigkeit"?istTaetigkeit:!istTaetigkeit;
    });
  }
  document.getElementById("fragen-count").textContent=`${gefiltert.length} Eintrag${gefiltert.length!==1?"e":""}`;
  if(gefiltert.length===0){el.innerHTML='<div class="empty">Noch keine Einträge.</div>';return;}
  el.innerHTML=gefiltert.map(r=>fragenCardHtml(r)).join("");
}

function fragenCardHtml(r){
  const id=`f-${r.row}`;
  const typ=(r.typ||"frage").toLowerCase();
  const istTaetigkeit=typ==="tätigkeit"||typ==="taetigkeit";
  return `<div class="entry-card" id="${id}">
    <div class="entry-num">Zeile ${r.row}</div>
    <div class="entry-header" onclick="toggleEntry('${id}')">
      <span class="entry-arrow">▶</span>
      <span class="entry-typ-tag">${istTaetigkeit?"Tätigkeit":"Frage"}</span>
      <span class="entry-summary">${esc(r.frage)}</span>
    </div>
    <div class="entry-body">
      <label>Typ</label>
      <select id="${id}-typ">
        <option value="Frage" ${!istTaetigkeit?"selected":""}>Frage</option>
        <option value="Tätigkeit" ${istTaetigkeit?"selected":""}>Tätigkeit</option>
      </select>
      <label>Frage / Tätigkeit</label>
      <textarea id="${id}-frage">${esc(r.frage)}</textarea>
      <div class="entry-row2">
        <div><label>Antwort / Kontrollpunkt 1</label><textarea class="ans" id="${id}-a1">${esc(r.a1)}</textarea></div>
        <div><label>Antwort / Kontrollpunkt 2</label><textarea class="ans" id="${id}-a2">${esc(r.a2)}</textarea></div>
      </div>
      <div class="entry-row2">
        <div><label>Antwort / Kontrollpunkt 3</label><textarea class="ans" id="${id}-a3">${esc(r.a3)}</textarea></div>
        <div><label>Antwort / Kontrollpunkt 4</label><textarea class="ans" id="${id}-a4">${esc(r.a4)}</textarea></div>
      </div>
      <label>Richtig (A–D, nur bei Frage)</label>
      <input type="text" id="${id}-richtig" value="${escAttr(r.richtig)}" maxlength="1" style="max-width:80px;text-transform:uppercase">
      <label>Erklärung</label>
      <textarea id="${id}-erklaerung">${esc(r.erklaerung)}</textarea>
      <div class="entry-actions">
        <button class="btn btn-red" onclick="loescheFrage(${r.row},'${id}')">Löschen</button>
        <button class="btn btn-green" onclick="speichereFrage(${r.row},'${id}')">Speichern</button>
      </div>
      <div class="status-msg" id="${id}-status"></div>
    </div>
  </div>`;
}

function neueFrage(){
  const el=document.getElementById("fragen-liste");
  const tempId="f-new-"+Date.now();
  const html=`<div class="entry-card new open" id="${tempId}">
    <div class="entry-header" onclick="toggleEntry('${tempId}')">
      <span class="entry-arrow">▶</span>
      <span class="entry-summary">Neue Frage / Tätigkeit</span>
    </div>
    <div class="entry-body">
      <label>Typ</label>
      <select id="${tempId}-typ">
        <option value="Frage" selected>Frage</option>
        <option value="Tätigkeit">Tätigkeit</option>
      </select>
      <label>Frage / Tätigkeit</label>
      <textarea id="${tempId}-frage"></textarea>
      <div class="entry-row2">
        <div><label>Antwort / Kontrollpunkt 1</label><textarea class="ans" id="${tempId}-a1"></textarea></div>
        <div><label>Antwort / Kontrollpunkt 2</label><textarea class="ans" id="${tempId}-a2"></textarea></div>
      </div>
      <div class="entry-row2">
        <div><label>Antwort / Kontrollpunkt 3</label><textarea class="ans" id="${tempId}-a3"></textarea></div>
        <div><label>Antwort / Kontrollpunkt 4</label><textarea class="ans" id="${tempId}-a4"></textarea></div>
      </div>
      <label>Richtig (A–D, nur bei Frage)</label>
      <input type="text" id="${tempId}-richtig" maxlength="1" style="max-width:80px;text-transform:uppercase">
      <label>Erklärung</label>
      <textarea id="${tempId}-erklaerung"></textarea>
      <div class="entry-actions">
        <button class="btn btn-green" onclick="speichereFrage(null,'${tempId}')">Anlegen</button>
      </div>
      <div class="status-msg" id="${tempId}-status"></div>
    </div>
  </div>`;
  el.insertAdjacentHTML("afterbegin",html);
}

async function speichereFrage(row,id){
  const sheet=document.getElementById("admin-fahrzeug").value;
  const payload={
    type:"admin_save_frage",password:ADMIN_PW,sheet,row:row||null,
    typ:val(id+"-typ"),frage:val(id+"-frage"),
    a1:val(id+"-a1"),a2:val(id+"-a2"),a3:val(id+"-a3"),a4:val(id+"-a4"),
    richtig:val(id+"-richtig").toUpperCase(),erklaerung:val(id+"-erklaerung")
  };
  const statusEl=document.getElementById(id+"-status");
  statusEl.className="status-msg";statusEl.style.display="block";statusEl.textContent="Wird gespeichert…";
  try{
    const res=await callAdmin(payload);
    if(res.ok){
      statusEl.className="status-msg status-ok";statusEl.textContent="Gespeichert.";
      setTimeout(()=>ladeFragenAdmin(),600);
    } else {
      statusEl.className="status-msg status-err";statusEl.textContent="Fehler beim Speichern.";
    }
  }catch(e){
    statusEl.className="status-msg status-err";statusEl.textContent="Fehler: "+e.message;
  }
}

async function loescheFrage(row,id){
  if(!confirm("Diesen Eintrag wirklich löschen?")) return;
  const sheet=document.getElementById("admin-fahrzeug").value;
  const statusEl=document.getElementById(id+"-status");
  statusEl.className="status-msg";statusEl.style.display="block";statusEl.textContent="Wird gelöscht…";
  try{
    const res=await callAdmin({type:"admin_delete_frage",password:ADMIN_PW,sheet,row});
    if(res.ok){ladeFragenAdmin();}
    else{statusEl.className="status-msg status-err";statusEl.textContent="Fehler beim Löschen.";}
  }catch(e){
    statusEl.className="status-msg status-err";statusEl.textContent="Fehler: "+e.message;
  }
}

/* ── Einsatzmeldungen ── */
async function ladeMeldungenAdmin(){
  const el=document.getElementById("meldungen-liste");
  el.innerHTML='<div class="loading">Wird geladen…</div>';
  try{
    const res=await callAdmin({type:"admin_list_einsatzmeldungen",password:ADMIN_PW});
    if(res.error){el.innerHTML='<div class="empty">Zugriff verweigert. Bitte neu anmelden.</div>';return;}
    LETZTE_MELDUNGEN=res.rows||[];
    renderMeldungenListe(LETZTE_MELDUNGEN);
  }catch(e){
    el.innerHTML=`<div class="empty">Fehler beim Laden: ${e.message}</div>`;
  }
}

function renderMeldungenListe(rows){
  const el=document.getElementById("meldungen-liste");
  const sortBy=document.getElementById("admin-meldung-sort").value;
  const sortiert=[...rows].sort((a,b)=>String(a[sortBy]||"").localeCompare(String(b[sortBy]||""),"de"));
  document.getElementById("meldungen-count").textContent=`${sortiert.length} Eintrag${sortiert.length!==1?"e":""}`;
  if(sortiert.length===0){el.innerHTML='<div class="empty">Noch keine Einträge.</div>';return;}
  el.innerHTML=sortiert.map(r=>meldungCardHtml(r)).join("");
}

function meldungCardHtml(r){
  const id=`m-${r.row}`;
  return `<div class="entry-card" id="${id}">
    <div class="entry-num">Zeile ${r.row}</div>
    <div class="entry-header" onclick="toggleEntry('${id}')">
      <span class="entry-arrow">▶</span>
      <span class="entry-typ-tag">${esc(r.kategorie)}</span>
      <span class="entry-summary">${esc(r.meldung)}</span>
    </div>
    <div class="entry-body">
    <div class="entry-row2">
      <div><label>Kategorie</label><input type="text" id="${id}-kategorie" value="${escAttr(r.kategorie)}"></div>
      <div><label>Alarmierung</label><input type="text" id="${id}-alarmierung" value="${escAttr(r.alarmierung)}"></div>
    </div>
    <label>Meldung</label>
    <textarea id="${id}-meldung">${esc(r.meldung)}</textarea>
    <label>Einsatzmittel (kommagetrennt)</label>
    <input type="text" id="${id}-mittel" value="${escAttr(r.mittel)}">
    <div class="entry-actions">
      <button class="btn btn-red" onclick="loescheMeldung(${r.row},'${id}')">Löschen</button>
      <button class="btn btn-green" onclick="speichereMeldung(${r.row},'${id}')">Speichern</button>
    </div>
    <div class="status-msg" id="${id}-status"></div>
    </div>
  </div>`;
}

function neueMeldung(){
  const el=document.getElementById("meldungen-liste");
  const tempId="m-new-"+Date.now();
  const html=`<div class="entry-card new open" id="${tempId}">
    <div class="entry-header" onclick="toggleEntry('${tempId}')">
      <span class="entry-arrow">▶</span>
      <span class="entry-summary">Neue Einsatzmeldung</span>
    </div>
    <div class="entry-body">
    <div class="entry-row2">
      <div><label>Kategorie</label><input type="text" id="${tempId}-kategorie"></div>
      <div><label>Alarmierung</label><input type="text" id="${tempId}-alarmierung"></div>
    </div>
    <label>Meldung</label>
    <textarea id="${tempId}-meldung"></textarea>
    <label>Einsatzmittel (kommagetrennt)</label>
    <input type="text" id="${tempId}-mittel">
    <div class="entry-actions">
      <button class="btn btn-green" onclick="speichereMeldung(null,'${tempId}')">Anlegen</button>
    </div>
    <div class="status-msg" id="${tempId}-status"></div>
    </div>
  </div>`;
  el.insertAdjacentHTML("afterbegin",html);
}

async function speichereMeldung(row,id){
  const payload={
    type:"admin_save_einsatzmeldung",password:ADMIN_PW,row:row||null,
    kategorie:val(id+"-kategorie"),alarmierung:val(id+"-alarmierung"),
    meldung:val(id+"-meldung"),mittel:val(id+"-mittel")
  };
  const statusEl=document.getElementById(id+"-status");
  statusEl.className="status-msg";statusEl.style.display="block";statusEl.textContent="Wird gespeichert…";
  try{
    const res=await callAdmin(payload);
    if(res.ok){
      statusEl.className="status-msg status-ok";statusEl.textContent="Gespeichert.";
      setTimeout(()=>ladeMeldungenAdmin(),600);
    } else {
      statusEl.className="status-msg status-err";statusEl.textContent="Fehler beim Speichern.";
    }
  }catch(e){
    statusEl.className="status-msg status-err";statusEl.textContent="Fehler: "+e.message;
  }
}

async function loescheMeldung(row,id){
  if(!confirm("Diese Einsatzmeldung wirklich löschen?")) return;
  const statusEl=document.getElementById(id+"-status");
  statusEl.className="status-msg";statusEl.style.display="block";statusEl.textContent="Wird gelöscht…";
  try{
    const res=await callAdmin({type:"admin_delete_einsatzmeldung",password:ADMIN_PW,row});
    if(res.ok){ladeMeldungenAdmin();}
    else{statusEl.className="status-msg status-err";statusEl.textContent="Fehler beim Löschen.";}
  }catch(e){
    statusEl.className="status-msg status-err";statusEl.textContent="Fehler: "+e.message;
  }
}

/* ── Fahrer-Lookup ── */
let LOOKUP_ERGEBNISSE=[];

async function sucheLookup(){
  const input=document.getElementById("lookup-suche").value.trim();
  const el=document.getElementById("lookup-ergebnisse");
  if(!input){el.innerHTML="";return;}
  el.innerHTML='<div class="loading">Wird gesucht…</div>';
  try{
    if(Object.keys(MITGLIEDER).length===0) await ladeMitglieder();
    const inputUpper=input.toUpperCase();
    let kuerzelSet=new Set();
    if(MITGLIEDER[inputUpper]) kuerzelSet.add(inputUpper);
    Object.entries(MITGLIEDER).forEach(([k,m])=>{
      if(m.vollerName.toLowerCase().includes(input.toLowerCase())) kuerzelSet.add(k);
    });
    if(kuerzelSet.size===0){
      el.innerHTML='<div class="empty">Keine Person gefunden.</div>';
      return;
    }
    const res=await callAdmin({type:"admin_lade_auswertung",password:ADMIN_PW});
    if(res.error){el.innerHTML='<div class="empty">Zugriff verweigert. Bitte neu anmelden.</div>';return;}
    AUSW_FRAGEN=res.fragen||[];
    AUSW_TAETIGKEITEN=res.taetigkeiten||[];
    const treffer=(res.fahrten||[]).map(row=>({
      datum:String(row["Datum"]||""),fahrer:String(row["Fahrer"]||""),beifahrer:String(row["Beifahrer"]||""),fahrzeug:String(row["Fahrzeug"]||""),
      fahrt:String(row["Fahrt"]||""),aufbau:String(row["Aufbau"]||""),gebiet:String(row["Gebiet"]||""),abfahrt:String(row["Abfahrt"]||""),rueckkehr:String(row["Rückkehr"]||""),
      anzahlEinsaetze:String(row["Anzahl Einsätze"]||""),einsatzadressen:String(row["Einsatzadressen"]||""),
      quizRichtig:String(row["Quiz Richtig"]||""),quizTotal:String(row["Quiz Total"]||""),pct:String(row["%"]||""),hilfe:String(row["Hilfe"]||"")
    })).filter(r=>kuerzelSet.has(r.fahrer.toUpperCase())||kuerzelSet.has(r.beifahrer.toUpperCase()));
    treffer.sort((a,b)=>b.datum.localeCompare(a.datum));
    LOOKUP_ERGEBNISSE=treffer;
    renderLookupErgebnisse(treffer);
  }catch(e){
    el.innerHTML=`<div class="empty">Fehler bei der Suche: ${e.message}</div>`;
  }
}

function renderLookupErgebnisse(treffer){
  const el=document.getElementById("lookup-ergebnisse");
  if(treffer.length===0){el.innerHTML='<div class="empty">Keine Fahrten gefunden.</div>';return;}
  el.innerHTML=`<div style="font-size:12px;color:var(--text3);margin-bottom:0.75rem">${treffer.length} Fahrt${treffer.length!==1?"en":""} gefunden</div>`+
    treffer.map((r,i)=>{
      const quizStr=r.quizTotal&&r.quizTotal!=="–"?`${r.quizRichtig}/${r.quizTotal} (${r.pct})`:"–";
      return `<div class="entry-card">
        <div style="font-weight:700;font-size:13px;margin-bottom:4px;">${esc(r.datum)} · ${esc(r.fahrzeug)}</div>
        <div style="font-size:12px;color:var(--text2);line-height:1.7;">
          Fahrer: ${esc(vollerNameAdmin(r.fahrer))}<br>
          Beifahrer: ${esc(vollerNameAdmin(r.beifahrer))}<br>
          Fahrzeit: ${esc(r.abfahrt)} – ${esc(r.rueckkehr)}<br>
          Fragen: ${quizStr}
        </div>
        <div class="entry-actions" style="justify-content:flex-start;margin-top:0.75rem;">
          <button class="btn btn-green" onclick="reprintPDF(${i})">PDF drucken</button>
        </div>
        <div class="status-msg" id="lookup-status-${i}"></div>
      </div>`;
    }).join("");
}

function vollerNameAdmin(kuerzel){
  const k=String(kuerzel||"").toUpperCase().trim();
  return (MITGLIEDER[k]&&MITGLIEDER[k].vollerName)||kuerzel;
}

async function reprintPDF(idx){
  const r=LOOKUP_ERGEBNISSE[idx];
  if(!r) return;
  const statusEl=document.getElementById(`lookup-status-${idx}`);
  statusEl.className="status-msg";statusEl.style.display="block";statusEl.textContent="PDF wird erstellt…";
  try{
    const fragenDetail=AUSW_FRAGEN.map(row=>({
      datum:String(row["Datum"]||""),fahrer:String(row["Fahrer"]||""),fahrzeug:String(row["Fahrzeug"]||""),
      frage:String(row["Frage"]||""),gegeben:String(row["Gegeben"]||""),korrekt:String(row["Korrekt"]||""),richtig:String(row["Richtig"]||"")
    })).filter(q=>q.datum===r.datum&&q.fahrer===r.fahrer&&q.fahrzeug===r.fahrzeug);
    const taetigkeitenDetail=AUSW_TAETIGKEITEN.map(row=>({
      datum:String(row["Datum"]||""),fahrer:String(row["Fahrer"]||""),fahrzeug:String(row["Fahrzeug"]||""),
      taetigkeit:String(row["Tätigkeit"]||""),stufe:String(row["Stufe"]||""),hilfe:String(row["Hilfe"]||"")
    })).filter(t=>t.datum===r.datum&&t.fahrer===r.fahrer&&t.fahrzeug===r.fahrzeug);
    generierePDFAdmin(r,fragenDetail,taetigkeitenDetail);
    statusEl.style.display="none";
  }catch(e){
    statusEl.className="status-msg status-err";statusEl.textContent="Fehler: "+e.message;
  }
}

function generierePDFAdmin(r,fragenDetail,taetigkeitenDetail){
  if(!window.jspdf){alert("PDF-Bibliothek konnte nicht geladen werden.");return;}
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF();
  const stufeLabel={"1":"Sehr gut","2":"Bitte weiter üben","3":"Nehmen wir auf"};

  let y=20;
  doc.setFont("helvetica","bold");
  doc.setFontSize(14);
  doc.text("Stützpunktfeuerwehr Meilen",20,y);
  y+=7;
  doc.setFontSize(11);
  doc.text("Fahrtraining – Bestätigung (Kopie)",20,y);
  y+=4;
  doc.setDrawColor(204,0,0);
  doc.setLineWidth(0.8);
  doc.line(20,y,190,y);
  y+=8;

  doc.setFont("helvetica","normal");
  doc.setFontSize(10);
  const zeile=(label,wert)=>{
    doc.setFont("helvetica","bold");doc.text(label,20,y);
    doc.setFont("helvetica","normal");doc.text(String(wert),65,y);
    y+=6;
  };
  zeile("Datum:",r.datum);
  zeile("Fahrzeug:",r.fahrzeug+(r.gebiet?" · "+r.gebiet:""));
  zeile("Fahrer:",vollerNameAdmin(r.fahrer));
  zeile("Beifahrer:",vollerNameAdmin(r.beifahrer));
  zeile("Fahrzeit:",`${r.abfahrt} – ${r.rueckkehr}`);

  y+=4;
  doc.setDrawColor(224,224,224);
  doc.setLineWidth(0.3);
  doc.line(20,y,190,y);
  y+=8;

  doc.setFont("helvetica","bold");
  doc.setFontSize(11);
  doc.text("Resultate",20,y);
  y+=7;
  doc.setFontSize(10);

  if(r.quizTotal&&r.quizTotal!=="–") zeile("Fragen richtig:",`${r.quizRichtig} von ${r.quizTotal} (${r.pct})`);
  if(r.anzahlEinsaetze&&r.anzahlEinsaetze!=="0") zeile("Einsätze gefahren:",r.anzahlEinsaetze);

  if(fragenDetail.length>0){
    doc.setFont("helvetica","bold");doc.text("Fragen im Detail:",20,y);y+=6;
    doc.setFont("helvetica","normal");
    fragenDetail.forEach((q,i)=>{
      const ok=q.richtig==="JA"?"✓":"✗";
      const lines=doc.splitTextToSize(`${ok} ${i+1}. ${q.frage}`,165);
      doc.text(lines,25,y);
      y+=lines.length*5;
    });
    y+=2;
  }

  if(taetigkeitenDetail.length>0){
    doc.setFont("helvetica","bold");doc.text("Tätigkeiten:",20,y);y+=6;
    doc.setFont("helvetica","normal");
    taetigkeitenDetail.forEach((t,i)=>{
      const lines=doc.splitTextToSize(`${i+1}. ${t.taetigkeit} – ${stufeLabel[t.stufe]||t.stufe}`,165);
      doc.text(lines,25,y);
      y+=lines.length*5;
    });
  }

  if(r.hilfe&&r.hilfe.trim()){
    y+=4;
    doc.setFont("helvetica","bold");doc.text("Hilfe/Bemerkungen:",20,y);y+=6;
    doc.setFont("helvetica","normal");
    const lines=doc.splitTextToSize(r.hilfe,165);
    doc.text(lines,25,y);
    y+=lines.length*5;
  }

  y+=8;
  doc.setDrawColor(224,224,224);
  doc.line(20,y,190,y);
  y+=6;
  doc.setFontSize(8);
  doc.setTextColor(120,120,120);
  doc.text(`Neu ausgestellt: ${new Date().toLocaleString("de-CH")} · CLv1.06`,20,y);

  const dateiname=`Fahrtraining_${r.datum}_${r.fahrer}_Kopie.pdf`;
  doc.save(dateiname);
}

/* ── Helpers ── */
function val(id){const el=document.getElementById(id);return el?el.value.trim():"";}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function escAttr(s){return esc(s).replace(/"/g,"&quot;");}
</script>
